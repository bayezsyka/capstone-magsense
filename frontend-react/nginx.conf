server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # 1. Hashed static assets in /assets/ -> Long cache immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 2. Service Worker, Workbox, Manifest -> STRICTLY NO CACHE
    location ~* (sw\.js|workbox-.*\.js|manifest\.webmanifest|manifest\.json)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    # 3. HTML & SPA routing fallback -> NO CACHE for index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # 4. Other root static files (favicon, pwa icons) -> short cache
    location ~* \.(?:ico|png|svg|jpg|jpeg|gif|webp)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
}
