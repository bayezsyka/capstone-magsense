server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # 1. Hashed static assets in /assets/ -> Long cache immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 2. Service Worker, Workbox bundle, Manifest -> STRICTLY NO CACHE
    #    These files live at root level (not in /assets/)
    location ~* ^/(sw\.js|workbox-.*\.js|manifest\.webmanifest|manifest\.json)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    # 3. HTML & SPA routing fallback -> NO CACHE
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }
}
