services:
  # === 1. CENTRAL DATABASE (POSTGRESQL) ===
  postgres:
    image: postgres:16-alpine
    container_name: capstone-central-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-praja171004}
      POSTGRES_DB: ${POSTGRES_DB:-smart_farming_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

  # === 2. CENTRAL BACKEND (EXPRESS + WEBSOCKET) ===
  backend:
    build:
      context: ./backend-express
      dockerfile: Dockerfile
    container_name: capstone-central-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-praja171004}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-smart_farming_db}
      JWT_SECRET: ${JWT_SECRET:-super_secret_key_industri}
    depends_on:
      postgres:
        condition: service_healthy

  # === 3. CENTRAL PUBLIC DASHBOARD (REACT) ===
  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "https://api-capstone.sangkolo.my.id/api"
        VITE_WS_URL: "https://api-capstone.sangkolo.my.id"
    container_name: capstone-central-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
