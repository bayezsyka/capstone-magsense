services:
  # === 1. CENTRAL DATABASE (POSTGRESQL) ===
  postgres:
    image: postgres:16-alpine
    container_name: capstone-central-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-smart_farming_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

  # === 2. ML HARVEST PREDICTION (XGBOOST FASTAPI) ===
  ml-panen:
    build:
      context: ./ml-panen
      dockerfile: Dockerfile
    container_name: capstone-central-ml-panen
    restart: unless-stopped
    ports:
      - "${HOST_ML_PORT:-8000}:8000"
    environment:
      PORT: 8000
      MODEL_PATH: /app/model/harvest.json
      DB_PATH: /data/prediksi.db
      MQTT_ENABLED: "false"
    volumes:
      - ./ml-panen/model:/app/model:ro
      - ml_data:/data

  # === 3. CENTRAL BACKEND (EXPRESS + WEBSOCKET) ===
  backend:
    build:
      context: ./backend-express
      dockerfile: Dockerfile
    container_name: capstone-central-backend
    restart: unless-stopped
    ports:
      - "${HOST_BACKEND_PORT:-5000}:5000"
    environment:
      PORT: 5000
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:?DB_PASS is required}
      DB_PASSWORD: ${DB_PASS:?DB_PASS is required}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-smart_farming_db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CV_SERVICE_URL: ${CV_SERVICE_URL:-http://172.18.0.1:5001/scan}
      YOLO_CONF: ${YOLO_CONF:-0.25}
      YOLO_IOU: ${YOLO_IOU:-0.6}
      YOLO_AUGMENT: ${YOLO_AUGMENT:-false}
      YOLO_CLASS_CONF: '${YOLO_CLASS_CONF:-{"0":0.65,"1":0.45,"2":0.70,"3":0.45}}'
      YOLO_IMGSZ: ${YOLO_IMGSZ:-960}
      YOLO_MAX_DET: ${YOLO_MAX_DET:-3000}
      TILED_MIN_LONG_SIDE: ${TILED_MIN_LONG_SIDE:-1920}
      TILE_SIZE: ${TILE_SIZE:-960}
      TILE_OVERLAP: ${TILE_OVERLAP:-0.25}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ml-panen:8000/predict}
    volumes:
      - ./backend-express:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  # === 4. CENTRAL PUBLIC DASHBOARD (REACT) ===
  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api-capstone.sangkolo.my.id/api}
        VITE_WS_URL: ${VITE_WS_URL:-https://api-capstone.sangkolo.my.id}
    container_name: capstone-central-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  pgdata:
  ml_data:
