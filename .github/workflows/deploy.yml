name: CI/CD Central Deploy (CT 801)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild all containers (Backend & Frontend)'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-ct801
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to CT 801
    runs-on: [self-hosted, capstone-ct801]
    steps:
      - name: Sync production checkout
        id: sync
        run: |
          OLD=$(git -C /capstone rev-parse HEAD || true)
          git -C /capstone fetch origin main
          git -C /capstone checkout -f -B main origin/main
          NEW=$(git -C /capstone rev-parse HEAD)
          if [ "$OLD" != "$NEW" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Execute Deployment Pipeline
        env:
          FORCE_REBUILD_ALL: ${{ inputs.force_rebuild || 'false' }}
        run: |
          chmod +x /capstone/deploy.sh
          if [ "${{ steps.sync.outputs.changed }}" = "true" ] || [ "$FORCE_REBUILD_ALL" = "true" ]; then
            /capstone/deploy.sh --force
          else
            /capstone/deploy.sh
          fi
