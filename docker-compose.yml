services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-REDACTED_DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-smart_farming_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-REDACTED_DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-smart_farming_db}
      JWT_SECRET: ${JWT_SECRET:-REDACTED_JWT_SECRET}
      DATA_SOURCE: ${DATA_SOURCE:-simulator}
      SIMULATOR_URL: ${SIMULATOR_URL:-https://magsense-sim.farros.space}
      SIMULATOR_POLL_INTERVAL_MS: ${SIMULATOR_POLL_INTERVAL_MS:-5000}
      MQTT_URL: ${MQTT_URL:-mqtt://broker.hivemq.com}
      MQTT_SENSOR_TOPIC: ${MQTT_SENSOR_TOPIC:-maggot/kandang/sensor}
    depends_on:
      postgres:
        condition: service_healthy

  backend-py:
    build:
      context: ./backend-py
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5002:5002"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
        VITE_PYTHON_URL: "http://localhost:5002"
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - backend-py

volumes:
  pgdata:
