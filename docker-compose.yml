services:
  # === 1. LOCAL EDGE MQTT BROKER ===
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: capstone-edge-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    command: sh -c "printf 'allow_anonymous true\nlistener 1883 0.0.0.0\n' > /mosquitto/config/mosquitto.conf && mosquitto -c /mosquitto/config/mosquitto.conf"

  # === 2. MOCK IOT TELEMETRY (ESP32 SIMULATOR) ===
  mock-iot:
    build:
      context: ./edge-pi-python
      dockerfile: Dockerfile
    container_name: capstone-edge-mock-iot
    restart: unless-stopped
    command: python mock_iot_publisher.py
    volumes:
      - ./edge-pi-python:/app
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - MQTT_TOPIC=maggot/sensor/data
      - PUBLISH_INTERVAL_SEC=5
    depends_on:
      - mosquitto

  # === 3. EDGE PYTHON WORKERS (MQTT, CV, ML, LOCAL API, CLOUD SYNC, WEBRTC) ===
  edge-service:
    build:
      context: ./edge-pi-python
      dockerfile: Dockerfile
    container_name: capstone-edge-service
    restart: unless-stopped
    command: python main_edge.py
    volumes:
      - ./edge-pi-python:/app
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - SQLITE_DB_PATH=edge_local.db
      - SYNC_URL=https://api-capstone.sangkolo.my.id/api/edge-sync
      - SYNC_INTERVAL_SEC=5
      - MOCK_CV=false
      - CV_INTERVAL_SEC=10
      - PREDICT_INTERVAL_SEC=20
      - LOCAL_API_PORT=8080
      - WEBRTC_PORT=8081
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      - mosquitto
