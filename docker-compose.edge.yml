services:
  # === 1. LOCAL EDGE MQTT BROKER ===
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: capstone-edge-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    command: sh -c "printf 'allow_anonymous true\nlistener 1883 0.0.0.0\nset_tcp_nodelay true\nconnection_messages true\n' > /mosquitto/config/mosquitto.conf && mosquitto -c /mosquitto/config/mosquitto.conf"

  # === 2. MOCK IOT TELEMETRY (ESP32 SIMULATOR) ===
  mock-iot:
    build:
      context: ./edge-pi-python
      dockerfile: Dockerfile
    container_name: capstone-edge-mock-iot
    restart: unless-stopped
    command: python mock_iot_publisher.py
    volumes:
      - ./edge-pi-python:/app
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - MQTT_TOPIC=maggot/sensor/data
      - PUBLISH_INTERVAL_SEC=5
    depends_on:
      - mosquitto

  # === 3. YOLO CV INFERENCE API ===
  cv-inference:
    build:
      context: ./edge-pi-python
      dockerfile: Dockerfile
    container_name: capstone-cv-inference
    restart: unless-stopped
    command: python cv_inference_server.py
    volumes:
      - ./edge-pi-python:/app
    environment:
      - YOLO_CONF=${YOLO_CONF:-0.25}
      - YOLO_IOU=${YOLO_IOU:-0.6}
      - YOLO_AUGMENT=${YOLO_AUGMENT:-false}
      - YOLO_CLASS_CONF=${YOLO_CLASS_CONF:-{"0":0.65,"1":0.45,"2":0.70,"3":0.45}}
      - YOLO_IMGSZ=${YOLO_IMGSZ:-960}
      - YOLO_MAX_DET=${YOLO_MAX_DET:-3000}
      - TILED_MIN_LONG_SIDE=${TILED_MIN_LONG_SIDE:-1920}
      - TILE_SIZE=${TILE_SIZE:-960}
      - TILE_OVERLAP=${TILE_OVERLAP:-0.25}
      - TILE_BORDER_PX=${TILE_BORDER_PX:-6}
      - TILE_NMS_IOU=${TILE_NMS_IOU:-0.5}
    ports:
      - "5001:5001"

  # === 4. EDGE PYTHON WORKERS (MQTT, CV, ML, LOCAL API, CLOUD SYNC) ===
  edge-service:
    build:
      context: ./edge-pi-python
      dockerfile: Dockerfile
    container_name: capstone-edge-service
    restart: unless-stopped
    command: python main_edge.py
    volumes:
      - ./edge-pi-python:/app
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - SQLITE_DB_PATH=edge_local.db
      - SYNC_URL=${SYNC_URL:-http://backend:5000/api/edge-sync}
      - SYNC_INTERVAL_SEC=5
      - MOCK_CV=${MOCK_CV:-true}
      - CV_INTERVAL_SEC=10
      - PREDICT_INTERVAL_SEC=20
      - LOCAL_API_PORT=8080
      - YOLO_CONF=${YOLO_CONF:-0.25}
      - YOLO_IOU=${YOLO_IOU:-0.6}
      - YOLO_AUGMENT=${YOLO_AUGMENT:-false}
      - YOLO_CLASS_CONF=${YOLO_CLASS_CONF:-{"0":0.65,"1":0.45,"2":0.70,"3":0.45}}
      - YOLO_IMGSZ=${YOLO_IMGSZ:-960}
      - YOLO_MAX_DET=${YOLO_MAX_DET:-3000}
      - TILED_MIN_LONG_SIDE=${TILED_MIN_LONG_SIDE:-1920}
      - TILE_SIZE=${TILE_SIZE:-960}
      - TILE_OVERLAP=${TILE_OVERLAP:-0.25}
      - TILE_BORDER_PX=${TILE_BORDER_PX:-6}
      - TILE_NMS_IOU=${TILE_NMS_IOU:-0.5}
    ports:
      - "8080:8080"
    depends_on:
      - mosquitto
